allprojects {
    plugins.withId('com.android.application') {
        extensions.getByName('androidComponents').finalizeDsl { android ->
            android.defaultConfig.applicationId = 'com.donglan.chrona.monitor.validation'
            android.defaultConfig.testApplicationId = 'com.donglan.chrona.monitor.validation.test'
            android.defaultConfig.testInstrumentationRunner = 'com.donglan.chrona.ClassroomMonitorInstrumentation'
            android.sourceSets.androidTest.java.setSrcDirs([file('src/monitorValidation/java'), file('src/androidTest/java')])
        }
    }
}
