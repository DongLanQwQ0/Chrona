// Native drawables and the project brand are the only vector sources for the LAN UI.
def generateLanVectors = tasks.register('generateLanVectors') {
    def icons = [house:'ic_nav_home', 'calendar-days':'ic_nav_schedule', inbox:'ic_nav_inbox',
        plus:'ic_add', x:'ic_x', 'chevron-right':'ic_chevron_right_line', 'chevron-left':'ic_chevron_left',
        'arrow-left':'ic_arrow_left', 'refresh-cw':'ic_refresh', settings:'ic_settings', check:'ic_check',
        clock:'ic_todo_clock', 'list-checks':'ic_homework', filter:'ic_filter_alt', circle:'ic_circle',
        'clock-alert':'ic_todo_alert', 'file-text':'ic_notes', search:'ic_search', 'log-out':'ic_log_out',
        'sun-moon':'ic_sun_moon', 'grid-2x2':'ic_grid']
    def sources = icons.collectEntries { name, resource -> [(name):file("src/main/res/drawable/${resource}.xml")] }
    def brand = rootProject.file('docs/assets/chrona-icon.svg')
    inputs.files(sources.values()); inputs.file(brand); inputs.file(file('lan-vectors.gradle'))
    outputs.files(file('src/main/assets/lan/icons.js'), file('src/main/assets/lan/brand.svg'))
    doLast {
        def ns = new groovy.xml.Namespace('http://schemas.android.com/apk/res/android', 'android')
        def convert
        convert = { node ->
            if (node.name() == 'group') {
                def x=node.attribute(ns.translateX) ?: '0', y=node.attribute(ns.translateY) ?: '0'
                return "<g transform=\"translate(${x} ${y})\">" + node.children().collect(convert).join('') + '</g>'
            }
            if (node.name() != 'path') throw new GradleException("Unsupported LAN vector node ${node.name()}")
            def attrs = [d:node.attribute(ns.pathData), fill:node.attribute(ns.fillColor) in ['#00000000','@android:color/transparent'] ? 'none' : 'currentColor', stroke:'none']
            if (node.attribute(ns.strokeColor)) {
                attrs.stroke='currentColor'; attrs['stroke-width']=node.attribute(ns.strokeWidth) ?: '2'
                attrs['stroke-linecap']=node.attribute(ns.strokeLineCap) ?: 'butt'
                attrs['stroke-linejoin']=node.attribute(ns.strokeLineJoin) ?: 'miter'
            }
            if(node.attribute(ns.fillType)=='evenOdd') attrs['fill-rule']='evenodd'
            return '<path ' + attrs.collect { k,v -> "${k}=\"${v}\"" }.join(' ') + '/>'
        }
        def values = sources.collectEntries { name, source ->
            def vector = new groovy.xml.XmlParser().parse(source)
            if(vector.attribute(ns.viewportWidth) != '24' || vector.attribute(ns.viewportHeight) != '24') throw new GradleException("Unexpected viewport: ${source}")
            [(name):vector.children().collect(convert).join('')]
        }
        file('src/main/assets/lan/icons.js').setText('// Generated by :app:generateLanVectors; edit native drawable sources.\nconst ICONS='+groovy.json.JsonOutput.toJson(values)+';\n','UTF-8')
        file('src/main/assets/lan/brand.svg').setText(brand.getText('UTF-8'),'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn(generateLanVectors) }
