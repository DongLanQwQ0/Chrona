<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾时 · Chrona</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div id="app"><section id="pair" class="pair glass"><div class="brand-mark">拾</div><p class="eyebrow">CHRONA</p><h1>拾时</h1><form id="pair-form"><label for="pair-code">手机上的六位配对码</label><input id="pair-code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" spellcheck="false" required><button type="submit" class="primary">连接手机</button></form><p class="subtle">在手机「设置 → 局域网访问」中开启连接</p></section>
<div id="workspace" hidden><header class="topbar"><a href="#home" class="wordmark">拾时 <span>Chrona</span></a><div class="top-actions"><span class="connection"><i></i>手机已连接</span><button id="refresh" class="icon-button" aria-label="刷新"><span data-icon="refresh-cw"></span></button><button id="theme" class="icon-button" aria-label="切换深浅色"><span data-icon="sun-moon"></span></button><button id="settings" class="icon-button" aria-label="设置"><span data-icon="settings"></span></button></div></header>
<main id="content" tabindex="-1"></main><div class="bottom"><nav class="glass" aria-label="主要页面"><button data-page="home"><span data-icon="house"></span><span>今日</span></button><button data-page="schedule"><span data-icon="calendar-days"></span><span>日程</span></button><button data-page="inbox"><span data-icon="inbox"></span><span>收件箱</span></button><button data-page="timetable"><span data-icon="grid-2x2"></span><span>课表</span></button></nav><button id="capture" class="capture primary" aria-label="记录"><span data-icon="plus"></span></button></div></div></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭"><span data-icon="x"></span></button></div><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite" hidden></div></body></html>
