<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'">
<style>
:root{--text:#152525;--muted:#526565;--link:#1468c8;--line:#bbcaca;font-size:16px;color:var(--text);font-family:system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{line-height:1.65;overflow-wrap:anywhere}main{display:flow-root;padding:0 0 12px}
h2{font-size:1.1875rem;line-height:1.45;margin:20px 0 8px}h3{font-size:1.0625rem;margin:16px 0 8px}p{margin:8px 0 12px}ul,ol{padding-left:1.5em}li{margin:4px 0}a{color:var(--link)}
img{display:block;max-width:100%;height:auto;margin:12px auto;border-radius:6px}pre{overflow:auto;padding:12px;background:#8881;border-radius:6px}code{font-family:monospace}blockquote{margin:12px 0;padding-left:12px;border-left:3px solid var(--line)}
.sources{display:flex;flex-wrap:wrap;gap:0 12px;font-size:.875rem}.sources a{min-height:44px;display:inline-flex;align-items:center;text-decoration:none}
.assignment{display:block;color:var(--link);min-height:48px;text-decoration:none;cursor:pointer}.assignment:focus-visible{outline:2px solid var(--link);outline-offset:2px}.assignment p{margin:4px 0}
.math-block{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:8px 0}.math-inline{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;line-height:0;vertical-align:baseline}mjx-container[display="true"]{margin:0!important;width:max-content;min-width:100%}.table-scroll{overflow-x:auto}table{border-collapse:collapse}th,td{padding:8px 12px;border:1px solid var(--line)}
mjx-container{display:inline-block;position:relative}mjx-assistive-mml{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.draft{color:var(--muted);font-size:.875rem}.formula-error{white-space:pre-wrap;color:var(--muted)}
</style>
<script>window.MathJax={startup:{typeset:false},tex:{packages:['base','ams','newcommand','configmacros','boldsymbol','mathtools','noundefined'],maxBuffer:20000,maxMacros:1000},svg:{fontCache:'local'},options:{enableMenu:false}};</script>
<script src="markdown-it-14.1.0.min.js"></script><script src="mathjax-tex-svg-3.2.2.js"></script>
</head><body><main id="notes"></main><script src="reader.js"></script></body></html>
