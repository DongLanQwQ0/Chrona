plugins {
    id 'com.android.application'
}

dependencies {
    implementation('com.google.zxing:core:3.5.3')
    implementation('org.nanohttpd:nanohttpd:2.3.1')
    implementation('com.squareup.okhttp3:okhttp:4.12.0')
    // iCalendar parsing and recurrence expansion; only the text reader is used.
    implementation('net.sf.biweekly:biweekly:0.6.8') {
        exclude group: 'com.fasterxml.jackson.core'
    }
}

def chronaDebugKeystore = providers.gradleProperty('chronaDebugKeystore').orNull
if (chronaDebugKeystore == null || !file(chronaDebugKeystore).isFile()) {
    throw new GradleException('Set chronaDebugKeystore to the existing Chrona debug keystore; a new key cannot upgrade the installed app.')
}

android {
    sourceSets.main.java.srcDir '../shared/src/main/java'
    namespace 'com.donglan.chrona'
    compileSdk 36

    defaultConfig {
        applicationId 'com.donglan.chrona'
        minSdk 26
        targetSdk 36
        versionCode 112
        versionName '0.14.5'
        testInstrumentationRunner 'com.donglan.chrona.LanAccessInstrumentation'
    }

    signingConfigs {
        debug {
            storeFile file(chronaDebugKeystore)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            // Preserve the signing identity used by installed Chrona versions.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
