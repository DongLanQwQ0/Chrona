plugins {
    id 'com.android.application'
}

def chronaDebugKeystore = providers.gradleProperty('chronaDebugKeystore').orNull
if (chronaDebugKeystore == null || !file(chronaDebugKeystore).isFile()) {
    throw new GradleException('Set chronaDebugKeystore to the existing Chrona debug keystore; a new key cannot upgrade the installed app.')
}

android {
    namespace 'com.donglan.chrona'
    compileSdk 36

    defaultConfig {
        applicationId 'com.donglan.chrona'
        minSdk 26
        targetSdk 36
        versionCode 46
        versionName '0.13.26'
    }

    signingConfigs {
        debug {
            storeFile file(chronaDebugKeystore)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
