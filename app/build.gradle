plugins {
    id 'com.android.application'
}

dependencies {
    // iCalendar parsing and recurrence expansion; only the text reader is used.
    implementation('net.sf.biweekly:biweekly:0.6.8') {
        exclude group: 'com.fasterxml.jackson.core'
    }
}

def chronaDebugKeystore = providers.gradleProperty('chronaDebugKeystore').orNull
if (chronaDebugKeystore == null || !file(chronaDebugKeystore).isFile()) {
    throw new GradleException('Set chronaDebugKeystore to the existing Chrona debug keystore; a new key cannot upgrade the installed app.')
}

android {
    namespace 'com.donglan.chrona'
    compileSdk 36

    defaultConfig {
        applicationId 'com.donglan.chrona'
        minSdk 26
        targetSdk 36
        versionCode 104
        versionName '0.13.84'
    }

    signingConfigs {
        debug {
            storeFile file(chronaDebugKeystore)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
